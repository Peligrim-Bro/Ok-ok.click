  <style>
    :root {
      --bg: #071018;
      --card: #0e1a24;
      --card2: #122230;
      --line: #1d3344;
      --text: #e8f3f0;
      --muted: #8aa3b3;
      --mint: #1ed9a8;
      --mint2: #0fb98a;
      --warn: #ffb020;
      --danger: #ff5d6c;
      --ok: #1ed9a8;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --safe: env(safe-area-inset-bottom, 0px);
      --nav: #0b1620f5;
      --sheet: #050b11;
      --header: linear-gradient(#071018f2, #071018e6 70%, #07101800);
      --tick: #0b1620;
      --tick-rec: #0c1c18;
      --chip: #0b1620;
    }
    html[data-theme="light"] {
      --bg: #f2f5f7;
      --card: #ffffff;
      --card2: #e8eef2;
      --line: #cfdbe3;
      --text: #12202a;
      --muted: #5a7382;
      --mint: #0ea87a;
      --mint2: #0b8f68;
      --warn: #c47a00;
      --danger: #d63b4d;
      --ok: #0ea87a;
      --shadow: 0 10px 24px rgba(18,40,55,.10);
      --nav: #fffffff5;
      --sheet: #f7fafb;
      --header: linear-gradient(#f2f5f7f5, #f2f5f7e8 70%, #f2f5f700);
      --tick: #e6eef2;
      --tick-rec: #dff3ec;
      --chip: #ffffff;
    }

    html[data-theme="light"] .ticker-track a, html[data-theme="light"] .ticker-track span { color: #2b4a40; }
    html[data-theme="light"] .ticker-tag { background: var(--card2); color: var(--muted); }
    html[data-theme="light"] nav.tab { box-shadow: 0 8px 22px rgba(20,40,50,.12); color: var(--text); }
    html[data-theme="light"] .install-mask { background: #dfe8eecc; }
    html[data-theme="light"] .clock { background: linear-gradient(180deg, #e7f6f0, #ffffff); }
    html[data-theme="light"] header.app { color: var(--text); }
    html[data-theme="light"] .hero { background: var(--card); }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Manrope, system-ui, sans-serif; overflow-x: hidden; }
    body { padding-bottom: calc(92px + var(--safe)); max-width: 100%; }
    img { max-width: 100%; display: block; }
    button, input, select, textarea { font: inherit; color: inherit; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
    header.app {
      position: sticky; top: 0; z-index: 20;
      background: var(--header);
      backdrop-filter: blur(12px);
      padding: calc(10px + env(safe-area-inset-top)) 0 10px;
      overflow-x: hidden;
    }
    header.app > .wrap { padding: 0 16px; max-width: 100%; }
    .tickers { margin: 8px -16px 0; overflow: hidden; }
    .ticker {
      display: flex; align-items: stretch; gap: 0;
      width: 100%; margin: 0; height: 32px; border-radius: 0;
      background: var(--tick); border-top: 1px solid var(--line);
      overflow: hidden;
    }
    .ticker.rec { background: var(--tick-rec); border-top-color: #1a3a30; }
    .ticker-tag {
      flex: 0 0 auto; display: grid; place-items: center;
      padding: 0 10px; background: #122230; color: var(--muted);
      font-size: 10px; font-weight: 700; letter-spacing: .08em;
    }
    .ticker-mask { flex: 1; overflow: hidden; display: flex; align-items: center; }
    .ticker-track {
      display: flex; align-items: center; width: max-content;
      animation: ticker 36s linear infinite;
    }
    .ticker.paused .ticker-track { animation-play-state: paused; }
    .ticker-track a, .ticker-track span {
      white-space: nowrap; padding: 0 22px;
      color: #b7d4cb; font-size: 12px; font-weight: 600;
      letter-spacing: .02em; text-decoration: none;
    }
    .ticker-track a:active { color: #1ed9a8; }
    .ticker-copy { display: flex; align-items: center; }
    @keyframes ticker {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ticker-track { animation: none; }
    }
    .back-btn {
      width: 36px; height: 36px; padding: 0; flex-shrink: 0;
      display: grid; place-items: center; font-size: 18px; line-height: 1;
    }

    .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }

    .brand h1, .brand p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .logo {
      width: 36px; height: 36px; border-radius: 12px; padding: 0; border: 0;
      background: #0b1b3a; overflow: hidden; display: grid; place-items: center;
    }
    .logo img { width: 36px; height: 36px; object-fit: cover; display: block; }
    .brand h1 { font-size: 18px; margin: 0; letter-spacing: -.03em; }

    .top-actions { margin-left: auto; display: flex; gap: 4px; flex-shrink: 0; }
    .chip, .lang {

    .clock.warn .digits { color: #f0d36a; }
    .clock.ok .digits { color: var(--mint); }
    .clock .sub { color: var(--muted); font-size: 12px; }
    .search {

    .filters button {
      flex: 0 0 auto; border: 1px solid var(--line); background: #0b1620;
      color: var(--muted); border-radius: 999px; padding: 8px 12px; font-size: 12px; font-weight: 700;
    }
    .filters button.on { background: var(--mint); color: #062018; border-color: var(--mint); }

    }
    .mini { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .mini span {
      font-size: 10px; font-weight: 800; letter-spacing: .02em;
      border: 1px solid var(--line); border-radius: 999px; padding: 3px 7px; color: var(--muted);
    }
    .mini .ok { color: #062018; background: var(--mint); border-color: var(--mint); }
    .mini .off { color: #ffd0d5; background: #5a1d28; border-color: #5a1d28; }
    .mapbox {
      border: 0; width: 100%; height: 180px; border-radius: 16px; margin: 10px 0;
      background: #122230;
    }
    .rules { display: grid; gap: 10px; }
    .rules article {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px;
    }
    .spin-mask {
      position: fixed; inset: 0; z-index: 60; background: #071018f2;
      display: none; align-items: flex-end; justify-content: center;
    }
    .spin-mask.on { display: flex; }
    .spin-card {
      width: min(520px, 100%); background: var(--card); border: 1px solid var(--line);
      border-radius: 24px 24px 0 0; padding: 16px 16px calc(18px + var(--safe));
    }
    .slot {
      display: grid; grid-template-columns: 1fr 56px; gap: 10px; align-items: center;
    }
    .reel-window {
      height: 252px; overflow: hidden; border-radius: 18px;
      border: 1px solid var(--line); background: #071018;
      position: relative;
    }
    .reel-window:after {
      content: ""; position: absolute; left: 0; right: 0; top: 84px; height: 84px;
      border: 2px solid var(--mint); border-radius: 14px; pointer-events: none;
    }
    .reel { will-change: transform; }
    .reel-item {
      height: 84px; display: grid; grid-template-columns: 72px 1fr; gap: 10px;
      align-items: center; padding: 8px 10px;
    }
    .reel-item img { width: 72px; height: 68px; object-fit: cover; border-radius: 12px; }
    .reel-item b { display: block; font-size: 14px; }
    .lever {
      height: 252px; border: 0; border-radius: 18px; background: #1ed9a8;
      color: #062018; font-weight: 800; writing-mode: vertical-rl;
      letter-spacing: .12em; text-transform: uppercase;
    }
    .lever:disabled { opacity: .5; }
    .hero {
      position: relative; border-radius: 22px; overflow: hidden; min-height: 168px;
      background: #0b1620; box-shadow: var(--shadow);
    }
    .hero img { width: 100%; height: 168px; object-fit: cover; filter: saturate(1.05); }
    .hero .shade {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 20%, #071018ee);
      padding: 16px; display: flex; flex-direction: column; justify-content: flex-end;
    }
    .brand-btn {
      width: 100%; border: 0; padding: 0; margin: 0 0 12px; text-align: center;
      border-radius: 28px; overflow: hidden; cursor: pointer;
      background: #0b1b3a; box-shadow: var(--shadow);
      display: grid; place-items: center; min-height: 280px;
    }
    .brand-btn img { width: 168px; height: 168px; object-fit: cover; border-radius: 28px; }
    .brand-btn .cap { margin-top: 8px; padding-bottom: 22px; }
    .brand-btn b { display: block; color: #fff; font-size: 22px; letter-spacing: -.03em; }
    .brand-btn small { color: #8aa3b3; letter-spacing: .16em; font-size: 10px; text-transform: uppercase; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800;
      letter-spacing: .04em; text-transform: uppercase; color: #062018; background: var(--mint);
      border-radius: 999px; padding: 4px 8px; width: max-content;
    }
    .hero h2 { margin: 8px 0 2px; font-size: 20px; }
    .hero span { color: #c9e6dd; font-size: 12px; }
    .scam {
      margin-top: 14px; background: linear-gradient(180deg, #2a1518, #1a1014);
      border: 1px solid #5a2430; border-radius: 20px; overflow: hidden;
    }
    .scam img { width: 100%; height: 120px; object-fit: cover; }
    .scam .body { padding: 12px 14px 14px; }
    .tag-danger {
      color: #ffd0d5; background: #5a1d28; border-radius: 999px; padding: 3px 8px;
      font-size: 11px; font-weight: 800; letter-spacing: .04em;
    }
    .grid { display: grid; gap: 12px; margin: 16px 0 8px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden;
    }
    .card .pic { position: relative; }
    .card img { width: 100%; height: 148px; object-fit: cover; }
    .card .flag {
      position: absolute; top: 10px; left: 10px; background: #062018cc; color: var(--mint);
      border: 1px solid #1ed9a866; padding: 4px 8px; border-radius: 999px; font-size: 11px; font-weight: 800;
    }
    .card .flag.prem { background: #2a2108cc; color: #ffd56a; border-color: #ffb02066; }
    .card .flag.check { background: #ffffffee; color: #1a2a38; border-color: #ffffff; }
    .card .meta { padding: 12px 13px 14px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .stars { color: #ffd56a; font-size: 12px; font-weight: 800; }
    .muted { color: var(--muted); font-size: 12px; }
    .card h3 { margin: 6px 0 4px; font-size: 16px; letter-spacing: -.02em; }
    .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .pill { background: #122230; color: #b7cdd8; border-radius: 999px; padding: 4px 8px; font-size: 11px; font-weight: 600; }
    .sheet {
      position: fixed; inset: 0; z-index: 40; background: var(--sheet);
      transform: translateY(110%); transition: transform .28s ease; overflow: auto;
      padding-bottom: calc(24px + var(--safe));
    }
    .sheet.open { transform: none; }
    .cover { position: relative; }
    .cover img { width: 100%; height: 240px; object-fit: cover; }
    .back {
      position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 12px;
      width: 40px; height: 40px; border-radius: 14px; border: 0; background: #071018cc; color: #fff;
    }
    .sheet .pad { padding: 16px; }
    .quote {
      background: #122230; border-left: 3px solid var(--mint); border-radius: 12px;
      padding: 10px 12px; margin: 8px 0;
    }
    .quote b { display: block; font-size: 12px; margin-bottom: 4px; }
    .quote p { margin: 0; color: #d5e6e0; font-size: 13px; line-height: 1.45; }
    .src { color: var(--muted); font-size: 11px; margin-top: 6px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      border: 0; border-radius: 14px; padding: 12px; font-weight: 800; text-decoration: none;
    }
    .btn.wa { background: #25d366; color: #062018; }
    .btn.map { background: #1a2c3b; color: var(--text); border: 1px solid var(--line); }
    .btn.call { background: var(--mint); color: #062018; }
    .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    .form { display: grid; gap: 10px; }
    .form input, .form select, .form textarea {
      width: 100%; background: #0b1620; border: 1px solid var(--line); border-radius: 14px; padding: 12px;
    }
    .okbox { background: #10261f; border: 1px solid #1ed9a855; border-radius: 16px; padding: 14px; }
    nav.tab {
      position: fixed; left: 10px; right: 10px;
      bottom: calc(10px + var(--safe)); z-index: 30;
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 2px; padding: 5px;
      background: var(--nav); border: 1px solid var(--line);
      border-radius: 22px;
      backdrop-filter: blur(18px);
      box-shadow: 0 12px 28px rgba(0,0,0,.4);
    }
    nav.tab button {
      min-width: 0; border: 0; background: transparent;

      display: grid; gap: 4px; place-items: center;
      padding: 8px 2px 7px; border-radius: 17px;
    }
    nav.tab button span {
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    nav.tab button.on { color: #062018; background: var(--mint); }
    nav.tab button.hot { color: #ffd0d5; background: #3a1218; }
    nav.tab button.hot.on { color: #fff; background: var(--danger); }
    nav.tab svg { width: 20px; height: 20px; }
    .sos {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      margin: 0 0 14px;
    }
    .sos a {
      display: grid; gap: 2px; text-decoration: none; color: #fff;
      background: var(--danger); border-radius: 16px; padding: 12px;
      font-weight: 800;
    }
    .sos a span { font-size: 11px; font-weight: 600; color: #ffd0d5; }
    .sos a.police { background: #1a2c3b; }
    .sos a.tourist { background: #7a1f2e; }
    .news {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 16px; padding: 12px; margin-bottom: 10px;
    }
    .news .when { font-size: 11px; color: var(--muted); font-weight: 800; }
    .donate {
      background: linear-gradient(180deg,#10261f,#0b1620);
      border: 1px solid #1ed9a855; border-radius: 18px; padding: 14px; margin: 14px 0;
    }
    .donate img.qr { width: 92px; height: 92px; border-radius: 12px; background: #fff; }
    .donate .qrs { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
    .donate .qrs div { text-align: center; font-size: 11px; color: var(--muted); }
    .wallet {
      font-size: 11px; word-break: break-all; background: #071018;
      border-radius: 10px; padding: 8px; margin-top: 6px;
    }
    .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
    .hint { font-size: 12px; color: var(--muted); line-height: 1.4; }
    .msg-grid { display: grid; gap: 10px; margin: 12px 0 16px; }
    .msg {
      display: flex; gap: 12px; align-items: center;
      background: var(--card); border: 1px solid var(--line);
      border-radius: 18px; padding: 12px; text-decoration: none; color: inherit;
    }
    .msg .ico {
      width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center;
      font-weight: 800; flex: 0 0 auto;
    }
    .msg.tg .ico { background: #2aabee; color: #fff; }
    .msg.wa .ico { background: #25d366; color: #062018; }
    .msg h3 { margin: 0 0 2px; font-size: 15px; }
    .dock {
      position: fixed; right: 14px; bottom: calc(108px + var(--safe)); z-index: 25;
      display: grid; gap: 8px;
    }
    .dock a {
      width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center;
      text-decoration: none; font-weight: 800; color: #fff; box-shadow: var(--shadow);
    }
    .dock .tg { background: #2aabee; }
    .dock .wa { background: #25d366; color: #062018; }
    .btn.tg { background: #2aabee; color: #fff; }

      display: none; align-items: flex-end; justify-content: center;
    }
    .install-mask.on { display: flex; }
    .install-card {
      width: min(560px, 100%); background: #0e1a24; border: 1px solid var(--line);
      border-radius: 24px 24px 0 0; padding: 18px 16px calc(18px + var(--safe));
    }
    .install-card ol { margin: 8px 0 14px; padding-left: 18px; color: #d5e6e0; }
    .install-card li { margin: 8px 0; }
    .drop {
      border: 1px dashed #2a4a5c; background: #0b1620; border-radius: 16px;
      padding: 14px; text-align: center; cursor: pointer;
    }
    .drop b { display: block; margin-bottom: 4px; }
    .previews { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 10px; }

    .previews img { width: 100%; height: 100%; object-fit: cover; }
    .previews button {
      position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border: 0;
      border-radius: 8px; background: #071018cc; color: #fff; font-weight: 800;

          if (v && typeof v === "object" && typeof v.size === "number") {
            if (v.size) photos += 1;
            continue;
          }
          if (v) lines.push(`${k}: ${v}`);
        }
        if (photos) lines.push(`фото: ${photos} (файлы ещё в Netlify → Forms)`);
      }
      const text = lines.join("\n").slice(0, 3500);
      if (text.replace(/\s/g, "").length < 16) return false;
      try {
        await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ chat_id: chat, text })
        });
        return true;
      } catch (_) {
        return false;
      }
    }

      packed.forEach((f, i) => data.set("photo" + (i + 1), f));
      try {
        await fetch("/", { method: "POST", body: data });
      } catch (_) {}
      await notifyTelegram(formName || "add-business", data);
      return data;
    }

    function startSnake() {
      const canvas = $("snCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const N = 16;
      const w = Math.min(360, (canvas.parentElement && canvas.parentElement.clientWidth) || 320);
      canvas.width = w; canvas.height = w;
      const cell = () => canvas.width / N;
      let snake = [{x:8,y:8},{x:7,y:8},{x:6,y:8}];
      let dir = {x:1,y:0};
      let next = {x:1,y:0};
      let food = {x:12,y:4};
      let score = 0;
      let dead = false;
      const bestEl = $("snBest");
      const scoreEl = $("snScore");
      const placeFood = () => {
        const taken = new Set(snake.map(s => s.x + "," + s.y));
        let x, y, guard = 0;
        do { x = (Math.random() * N) | 0; y = (Math.random() * N) | 0; guard++; }
        while (taken.has(x + "," + y) && guard < 200);
        food = {x, y};
      };
      const draw = () => {
        const c = cell();
        ctx.fillStyle = "#08141c";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#1ed9a8";
        ctx.fillRect(food.x * c + 2, food.y * c + 2, c - 4, c - 4);
        snake.forEach((s, i) => {
          ctx.fillStyle = i === 0 ? "#e8f3f0" : "#0fb98a";
          ctx.fillRect(s.x * c + 1, s.y * c + 1, c - 2, c - 2);
        });
        if (dead) {
          ctx.fillStyle = "rgba(0,0,0,.45)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#fff";
          ctx.font = "700 22px Manrope,sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(t().gameOver, canvas.width / 2, canvas.height / 2);
        }
      };
      const step = () => {
        if (dead) return;
        dir = next;
        const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
        if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || snake.some(s => s.x === head.x && s.y === head.y)) {
          dead = true; draw(); return;
        }
        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
          score += 10;
          scoreEl.textContent = score;
          const best = Math.max(score, Number(localStorage.getItem("pok-snake") || 0));
          localStorage.setItem("pok-snake", String(best));
          bestEl.textContent = best;
          placeFood();
        } else snake.pop();
        draw();
      };
      const turn = (x, y) => {
        if (dead) return;
        if (x === -dir.x && y === -dir.y) return;
        next = {x, y};
      };
      const key = (e) => {
        const map = {ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0]};
        if (map[e.key]) { e.preventDefault(); turn(map[e.key][0], map[e.key][1]); }
      };
      window._pokSnake = { tick: setInterval(step, 140), key };
      window.addEventListener("keydown", key);
      draw();
      $("snAgain").onclick = () => { stopGame(); startSnake(); };
      document.querySelectorAll(".game-pad [data-dir]").forEach((b) => {
        b.onclick = () => {
          const parts = b.dataset.dir.split(",");
          turn(Number(parts[0]), Number(parts[1]));
        };
      });
      let sx = 0, sy = 0;
      canvas.addEventListener("touchstart", (e) => {
        const tch = e.changedTouches[0]; sx = tch.clientX; sy = tch.clientY;
      }, {passive:true});
      canvas.addEventListener("touchend", (e) => {
        const tch = e.changedTouches[0];
        const dx = tch.clientX - sx, dy = tch.clientY - sy;
        if (Math.abs(dx) + Math.abs(dy) < 16) return;
        if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
        else turn(0, dy > 0 ? 1 : -1);
      }, {passive:true});
    }

      if (isStandalone) {
        return `<h2>${t().installDone}</h2><p class="hint">${t().tagline}</p><button class="btn ghost" id="installClose" type="button">OK</button>`;
      }
      if (isIOS) {
        return `<h2>${t().installTitle}</h2><p class="hint">${t().installLead}</p>
          <ol>
            <li>${t().installIos1}</li>
            <li>${t().installIos2}</li>
            <li>${t().installIos3}</li>
          </ol>
          <button class="btn call" id="installClose" type="button">${t().installLater}</button>`;
      }
      return `<h2>${t().installTitle}</h2><p class="hint">${t().installLead}</p>
        <p>${t().installAnd}</p>
        <div class="actions">
          <button class="btn call" id="installNow" type="button">${t().installBtn}</button>
          <button class="btn ghost" id="installClose" type="button">${t().installLater}</button>
        </div>`;
    }

    function openInstall(force) {
      if (isStandalone && !force) return;
      $("installCard").innerHTML = installHTML();
      $("installMask").classList.add("on");
      const close = () => {
        $("installMask").classList.remove("on");
        localStorage.setItem("pok-install-seen", "1");
      };
      const later = $("installClose");
      if (later) later.onclick = close;
      const now = $("installNow");
      if (now) now.onclick = async () => {
        if (deferredInstall) {
          deferredInstall.prompt();
          await deferredInstall.userChoice.catch(() => {});
          deferredInstall = null;
        }
        close();
      };
      $("installMask").onclick = (e) => { if (e.target.id === "installMask") close(); };
    }

    const wantInstall = /[?&]install=1\b/.test(location.search) || location.hash === "#install";
    if (wantInstall || (!isStandalone && !localStorage.getItem("pok-install-seen"))) {
      setTimeout(() => openInstall(wantInstall), wantInstall ? 300 : 1200);
    }
    if ($("installBtn")) $("installBtn").onclick = () => openInstall(true);
    if ($("spotBtn")) $("spotBtn").onclick = () => setTab("spot");
    if ($("timerBtn")) $("timerBtn").onclick = () => setTab("timer");
    $("reportBtn").onclick = () => { reportPreset = ""; setTab("report"); };
    $("backBtn").onclick = goBack;
  </script>
</body>
</html>
